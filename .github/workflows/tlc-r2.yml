name: R0.2c Phase B Toolchain Freeze

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tlc-r2.yml'

jobs:
  freeze-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify current official TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o tla2tools.jar
          echo '20322939d1b55bb0a3f674ab34bb69b87c711a6b35559d32445cb7d7f6d3bb58  tla2tools.jar' | sha256sum -c -
          sha256sum tla2tools.jar | tee tla2tools.sha256
          java -version 2>&1 | tee java-version.txt
          java -cp tla2tools.jar tlc2.TLC -help 2>&1 | head -40 | tee tlc-help.txt || true
      - name: Upload exact toolchain
        uses: actions/upload-artifact@v4
        with:
          name: r0-2c-phase-b-toolchain
          path: |
            tla2tools.jar
            tla2tools.sha256
            java-version.txt
            tlc-help.txt
